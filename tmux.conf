# Minimal tmux config for the web terminal.
# The browser terminal is the "window", so hide tmux's own status bar.
set -g status off

# Mouse wheel scrolls back through history instead of sending arrow keys.
set -g mouse on
set -g history-limit 20000

# Snappier Esc in vim/nano, and 256-colour/truecolour passthrough.
set -sg escape-time 10
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
