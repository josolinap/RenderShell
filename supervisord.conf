[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# 1. Tailscale daemon (userspace networking)
[program:tailscaled]
command=/usr/local/bin/tailscaled --state=mem: --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=10

# 2. Register with Tailscale as exit node
[program:tailscale-up]
command=/bin/sh -c 'sleep 3 && tailscale up --auth-key="${TAILSCALE_AUTHKEY}" --advertise-exit-node --accept-routes --reset --hostname="${TAILSCALE_HOSTNAME:-render-exit-node}"'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=2
priority=20

# 3. SSH daemon (shellinabox authenticates via SSH)
[program:sshd]
command=/usr/sbin/sshd -D -e
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=25

# 4. Shellinabox web terminal (proxied via tailscale serve on 443)
[program:shellinabox]
command=/usr/bin/shellinaboxd --disable-ssl --no-beep -s /:SSH:localhost:22 -p 4200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=30

# 5. File Browser — lightweight web-based file manager GUI
#    Browse, upload, download, edit files in /root
#    Runs on port 5800 (proxied via tailscale serve on a separate path)
[program:filebrowser]
command=/usr/local/bin/filebrowser --database /etc/filebrowser.db
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=35

# 6. HTTP status page on Render's port
[program:http-server]
command=python3 -m http.server 8080 --bind 0.0.0.0 --directory /workspace
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=40

# 7. Expose both shellinabox + filebrowser via Tailscale Serve
#    shellinabox on / (port 443 → 4200)
#    filebrowser on /files (port 443 → 5800)
[program:tailscale-serve]
command=/bin/sh -c 'sleep 15 && tailscale serve --bg 4200 && tailscale serve --bg --set-path /files http://localhost:5800'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=5
priority=50
